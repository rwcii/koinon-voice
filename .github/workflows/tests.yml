name: Tests
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Longer than the race suite's 30-minute go test timeout, so a hung test reports its stack.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go test -race -timeout 30m ./...
      - name: Build and test the Apple helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The helper needs FoundationModels and Speech from a macOS 26.4 SDK or later; the
          # runner's SDK is reported either way (definition of done, The machine).
          sdk="$(xcrun --show-sdk-path)"
          version="$(xcrun --show-sdk-version)"
          echo "SDK $version at $sdk; $(xcodebuild -version | tr '\n' ' ')"
          frameworks="$sdk/System/Library/Frameworks"
          if [ -d "$frameworks/FoundationModels.framework" ] && [ -d "$frameworks/Speech.framework" ] &&
            [ "$(printf '%s\n' 26.4 "$version" | sort -V | head -1)" = 26.4 ]; then
            swift build -c release --package-path helpers/apple
            helpers/apple/test.sh
          else
            echo "::notice::The macOS $version SDK lacks what the Apple helper needs; it was not built."
          fi
      - name: Build the four CGO-free targets
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o "$RUNNER_TEMP/koinon-voice-${target//\//-}" ./cmd/koinon-voice
          done
